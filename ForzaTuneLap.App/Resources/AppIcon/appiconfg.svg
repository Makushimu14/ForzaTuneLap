<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <!-- Un chronomètre : l'arc rouge est un tour chronométré, l'aiguille s'arrête à sa fin. -->
    <g transform="translate(0,19)">
        <!-- Bouton et tige du haut -->
        <rect x="204" y="62" width="48" height="26" rx="8" fill="#f2f4f8" />
        <rect x="218" y="86" width="20" height="26" fill="#f2f4f8" />
        <!-- Bouton incliné -->
        <rect x="302" y="96" width="44" height="22" rx="7" fill="#f2f4f8" transform="rotate(42 324 107)" />

        <!-- Cadran -->
        <circle cx="228" cy="228" r="105" fill="#12151f" stroke="#f2f4f8" stroke-width="18" />

        <!-- Graduations des quatre points cardinaux -->
        <g stroke="#f2f4f8" stroke-width="9" stroke-linecap="round" opacity="0.85">
            <line x1="228" y1="138" x2="228" y2="154" />
            <line x1="228" y1="302" x2="228" y2="318" />
            <line x1="138" y1="228" x2="154" y2="228" />
            <line x1="302" y1="228" x2="318" y2="228" />
        </g>

        <!-- Le tour : un arc rouge de midi jusqu'à l'aiguille -->
        <path d="M 228 123 A 105 105 0 0 1 331.4 246.2" fill="none" stroke="#ff4b2b" stroke-width="18" stroke-linecap="round" />

        <!-- Aiguille et axe -->
        <line x1="228" y1="228" x2="296.9" y2="240.2" stroke="#ff4b2b" stroke-width="14" stroke-linecap="round" />
        <circle cx="228" cy="228" r="13" fill="#f2f4f8" />
    </g>
</svg>
